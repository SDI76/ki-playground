<svg xmlns="http://www.w3.org/2000/svg" width="680" height="496" viewBox="0 0 680 496" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Wie Agenten mit der Simulation sprechen</title>
<desc>Drei Arten von KI erreichen die Welt im Simulationsserver: Claude Code oder Codex über die HTTP-API, ein Endpunkt-Modell über den Runner im Server, eine externe KI über MCP oder HTTP-API. Der Browser zeigt die Welt nur an.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.ts{font-size:12px;text-anchor:middle;dominant-baseline:central}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.ki rect{fill:#EEEDFE;stroke:#534AB7}.ki .th{fill:#3C3489}.ki .ts{fill:#534AB7}
.srv rect{fill:#E1F5EE;stroke:#0F6E56}.srv .th{fill:#085041}.srv .ts{fill:#0F6E56}
.neu rect{fill:#F1EFE8;stroke:#5F5E5A}.neu .th{fill:#2C2C2A}.neu .ts{fill:#5F5E5A}
</style>
</defs>
<rect x="0.5" y="0.5" width="679" height="495" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<g class="ki"><rect x="40" y="40" width="180" height="56" rx="8"/><text class="th" x="130" y="58">Claude Code, Codex</text><text class="ts" x="130" y="78">curl und eigene Skripte</text></g>
<g class="ki"><rect x="250" y="40" width="180" height="56" rx="8"/><text class="th" x="340" y="58">Endpunkt-Modell</text><text class="ts" x="340" y="78">OpenRouter oder lokal</text></g>
<g class="ki"><rect x="460" y="40" width="180" height="56" rx="8"/><text class="th" x="550" y="58">Externe KI</text><text class="ts" x="550" y="78">Chat, Harness, Skript</text></g>
<rect x="40" y="130" width="600" height="236" rx="12" fill="#FAFAF7" stroke="#888780" stroke-dasharray="4 4"/>
<text class="th" x="235" y="154" fill="#2C2C2A">Simulationsserver</text>
<text class="ts" x="445" y="154" fill="#5F5E5A">lokal, Port 4710</text>
<line class="arr" x1="130" y1="96" x2="130" y2="182" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="100" x2="340" y2="182" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="550" y1="96" x2="550" y2="182" marker-end="url(#arrow)"/>
<g class="srv"><rect x="60" y="186" width="170" height="56" rx="8"/><text class="th" x="145" y="204">HTTP-API</text><text class="ts" x="145" y="224">observe und input</text></g>
<g class="srv"><rect x="255" y="186" width="170" height="56" rx="8"/><text class="th" x="340" y="204">Runner</text><text class="ts" x="340" y="224">Werkzeug-Schleife</text></g>
<g class="srv"><rect x="450" y="186" width="170" height="56" rx="8"/><text class="th" x="535" y="204">MCP oder HTTP-API</text><text class="ts" x="535" y="224">gleiche Werkzeuge</text></g>
<line class="arr" x1="145" y1="242" x2="145" y2="286" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="242" x2="340" y2="286" marker-end="url(#arrow)"/>
<line class="arr" x1="535" y1="242" x2="535" y2="286" marker-end="url(#arrow)"/>
<g class="srv"><rect x="60" y="290" width="560" height="56" rx="8"/><text class="th" x="340" y="308">Welt</text><text class="ts" x="340" y="328">Körper, Physik, Hörweite, Ereignisse</text></g>
<line class="arr" x1="340" y1="346" x2="340" y2="416" marker-end="url(#arrow)"/>
<g class="neu"><rect x="220" y="420" width="240" height="56" rx="8"/><text class="th" x="340" y="438">Webapp im Browser</text><text class="ts" x="340" y="458">Ansicht, Pause, Tempo, Dateien</text></g>
</svg>
